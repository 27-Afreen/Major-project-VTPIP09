{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-header py-3"><h4 class="mb-0"><i class="fas fa-user-md mr-2"></i>Select a Doctor</h4></div>
    <div class="card-body">
        {% if result %}
        <form method="POST" action="/usend">
            <div class="form-group">
                <label><i class="fas fa-stethoscope mr-1"></i> Choose Doctor</label>
                <select name="did" class="form-control" required>
                    <option value="">-- Select a doctor --</option>
                    {% for doc in result %}
                    <option value="{{ doc[1] }}">Dr. {{ doc[0] }} — {{ doc[4] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-notes-medical mr-1"></i> Describe Your Symptoms</label>
                <textarea name="sym" class="form-control" rows="4" placeholder="Describe your symptoms in detail..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Send to Doctor</button>
            <a href="/uhome" class="btn btn-secondary btn-lg ml-2">Cancel</a>
        </form>
        {% else %}
        <div class="text-center py-5">
            <i class="fas fa-info-circle fa-3x text-info mb-3"></i>
            <h5 class="text-muted">No doctors are registered yet.</h5>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
