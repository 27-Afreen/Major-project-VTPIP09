{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header py-3 text-center"><h4 class="mb-0"><i class="fas fa-user-shield mr-2"></i>Admin Login</h4></div>
            <div class="card-body p-4">
                <form method="POST" action="/alogin">
                    <div class="form-group">
                        <label><i class="fas fa-user mr-1"></i> Username</label>
                        <input type="text" name="uid" class="form-control" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock mr-1"></i> Password</label>
                        <input type="password" name="pwd" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
                </form>
                <hr>
                <p class="text-center text-muted mb-0"><small>Default: username <code>lab</code> / password <code>lab</code></small></p>
            </div>
        </div>
        <div class="text-center mt-3"><a href="/" class="text-muted"><i class="fas fa-arrow-left mr-1"></i>Back to Home</a></div>
    </div>
</div>
{% endblock %}
