{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header py-3 text-center"><h4 class="mb-0"><i class="fas fa-user-plus mr-2"></i>Patient Registration</h4></div>
            <div class="card-body p-4">
                <form method="POST" action="/ureg">
                    <div class="form-group">
                        <label><i class="fas fa-user mr-1"></i> Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope mr-1"></i> Email</label>
                        <input type="email" name="uid" class="form-control" placeholder="Enter email" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock mr-1"></i> Password</label>
                        <input type="password" name="pwd" class="form-control" placeholder="Create password" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone mr-1"></i> Mobile Number</label>
                        <input type="text" name="mob" class="form-control" placeholder="Enter mobile number" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt mr-1"></i> Location</label>
                        <input type="text" name="loc" class="form-control" placeholder="Enter your city/location" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Register</button>
                </form>
                <hr>
                <p class="text-center mb-0">Already have an account? <a href="/user">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
