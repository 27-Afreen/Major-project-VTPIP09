<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTPIP09 - Medical Imaging System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #1a237e, #283593); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card-header { border-radius: 12px 12px 0 0 !important; background: linear-gradient(135deg, #1a237e, #283593); color: #fff; }
        .btn-primary { background: #1a237e; border: none; border-radius: 8px; }
        .btn-primary:hover { background: #283593; }
        .btn-success { border-radius: 8px; }
        .btn-danger  { border-radius: 8px; }
        .form-control { border-radius: 8px; }
        .alert { border-radius: 8px; }
        .table thead th { background: #1a237e; color: #fff; border: none; }
        .badge-role { padding: 6px 14px; border-radius: 20px; font-size: 13px; }
        footer { background: #1a237e; color: #fff; text-align: center; padding: 14px; margin-top: 40px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand font-weight-bold" href="/"><i class="fas fa-heartbeat mr-2"></i>VTPIP09</a>
    <div class="ml-auto">
        <a class="nav-link d-inline" href="/"><i class="fas fa-home mr-1"></i>Home</a>
        <a class="nav-link d-inline" href="/logout"><i class="fas fa-sign-out-alt mr-1"></i>Logout</a>
    </div>
</nav>

<div class="container mt-4">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-info alert-dismissible fade show">
                    <i class="fas fa-info-circle mr-2"></i>{{ msg }}
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>

<footer><p class="mb-0">&copy; 2024 VTPIP09 Medical Imaging System. All rights reserved.</p></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
