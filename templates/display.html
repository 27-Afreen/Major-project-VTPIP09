{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-header py-3"><h4 class="mb-0"><i class="fas fa-x-ray mr-2"></i>Scan Image (Doctor View)</h4></div>
    <div class="card-body text-center">
        {% if result %}
        <img src="/static/{{ result[0] }}" class="img-fluid rounded" style="max-height:500px; border:2px solid #1a237e;" alt="Scan Image">
        <div class="mt-3">
            <a href="/dhome" class="btn btn-primary"><i class="fas fa-home mr-1"></i>Dashboard</a>
        </div>
        {% else %}
        <div class="py-5">
            <i class="fas fa-image fa-4x text-muted mb-3"></i>
            <h5 class="text-muted">Scan image not available.</h5>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
